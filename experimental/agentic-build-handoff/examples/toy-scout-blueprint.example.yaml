# Fictional, incomplete illustration. Not builder-ready and not a recommendation for a real business.
schema_version: 0.3-experimental
initiative: Toy Scout lead-triage pilot
decision: bounded_agentic_pilot
pilot_stage: offline_evaluation
owner: Fictional business owner
operating_model: human_team_with_ai_assistance

release_gates:
  - stage: design_review
    status: approved
    approver: Fictional business owner
    evidence_required:
      - Assessment and handoff decision reviewed.
    authorized_scope:
      - Design review only.
    invalidation_conditions:
      - Business outcome, owner, or evidence boundary changes.
    approval_reference: Fictional design-review decision
  - stage: deterministic_baseline
    status: pending
    approver: Fictional business owner
    evidence_required:
      - Approved synthetic-data manifest, fixed rules, criteria, limits, and test plan.
    authorized_scope: []
    invalidation_conditions:
      - Any dataset, rule, criterion, limit, reviewer, or environment change.
    approval_reference: ""
  - stage: agentic_challenger
    status: pending
    approver: Fictional business owner
    evidence_required:
      - Baseline results and an approved unmet-gap record explaining why simpler assistance is insufficient.
    authorized_scope: []
    invalidation_conditions:
      - Baseline, holdout, model, prompt, tool, criterion, or authority change.
    approval_reference: ""
  - stage: production_consideration
    status: pending
    approver: Fictional business owner
    evidence_required:
      - Separate production-readiness review and explicit production decision.
    authorized_scope: []
    invalidation_conditions:
      - Any material production use, data, integration, control, vendor, or risk change.
    approval_reference: ""

evaluation_criteria:
  - id: provenance-completeness
    measure: Material packet statements with traceable supplied evidence or deterministic calculation
    criterion_type: minimum_success
    operator: gte
    value: 100
    unit: percent
    measurement_method: Human reviewer checks each material statement against the provenance trace.
    status: pending
    owner: Fictional business owner
    approval_reference: ""
  - id: false-positive-tolerance
    measure: Poor leads incorrectly recommended for review
    criterion_type: maximum_failure
    operator: lte
    value: null
    unit: percent
    measurement_method: Compare recommendations with the frozen human-labeled holdout.
    status: pending
    owner: Fictional business owner
    approval_reference: ""
  - id: warning-miss-tolerance
    measure: Known condition or authenticity warnings missed
    criterion_type: maximum_failure
    operator: lte
    value: null
    unit: count
    measurement_method: Count missed warnings in the frozen labeled holdout.
    status: pending
    owner: Fictional business owner
    approval_reference: ""
  - id: evaluation-cost-cap
    measure: Total approved evaluation cost
    criterion_type: resource_limit
    operator: lte
    value: null
    unit: USD
    measurement_method: Sum recorded model, compute, and human-review costs for the approved run.
    status: pending
    owner: Fictional business owner
    approval_reference: ""

baseline_gap_gate:
  status: not_evaluated
  business_need: Reduce review effort without losing useful discoveries or condition and authenticity warnings.
  baseline_method: Pending owner approval of a deterministic fixed-workflow comparator.
  baseline_result: Not evaluated.
  required_threshold: Pending approved evaluation criteria.
  measured_gap: Not measured.
  business_consequence: Unknown until the baseline is evaluated.
  simpler_options_considered:
    - Structured review template
    - Deterministic duplicate and comparison rules
    - Ordinary AI drafting without agentic control
  why_simpler_insufficient: Not established.
  owner_decision: pending
  approver: Fictional business owner
  decision_reference: ""

authority_by_stage:
  evaluation:
    status: pending
    human_review_model: Strict sequential review by the named evidence reviewers and owner for a scored evaluation.
    substitution_rule: No substitution without a new staffing decision, updated tests, and new approval.
    authority_reference: HUMAN_AUTHORITY.md evaluation section
  proposed_operations:
    status: not_designed
    human_review_model: Must be proposed from evidence after evaluation; evaluation rules do not become operating rules automatically.
    substitution_rule: Any delegation, parallel review, sampling, or exception-only review requires separate design and approval.
    authority_reference: HUMAN_AUTHORITY.md proposed-operations section
  production:
    status: not_reviewed
    approval_reference: ""

roles:
  - id: business-owner
    kind: human
    purpose: Own the pilot outcome, sourcing decisions, and customer trust.
    accountable_human: Fictional business owner
    responsibilities:
      - Approve the source, category, limits, and success measures.
      - Review every suggested lead and make every purchase decision.
      - Stop the pilot when a failure signal occurs.
    recommendations: []
    permitted_actions:
      - Approve, reject, or investigate a candidate.
      - Pause or end the pilot.
    prohibited_actions: []
    handoffs:
      - Receive the daily candidate list with original-source evidence from lead-triage-support.
    fallback: Perform the established manual lead review.
  - id: lead-triage-support
    kind: agent
    purpose: Prepare a private, bounded candidate list for owner review.
    accountable_human: Fictional business owner
    responsibilities:
      - Normalize visible candidate details from the approved source.
      - Flag missing evidence and explain ranking reasons.
      - Prepare the review list without contacting a seller.
    recommendations:
      - Recommend which candidates deserve human review.
    permitted_actions:
      - Read synthetic or specifically copied test records within the evaluation limit.
      - Prepare a private candidate list.
    prohibited_actions:
      - Contact sellers.
      - Purchase or negotiate for an item.
      - Make authenticity or appraisal claims.
    handoffs:
      - Deliver the candidate list and source links to business-owner for acceptance or rejection.
    fallback: Stop the run and direct the owner to the manual review process.

outcome:
  problem: Promising vintage-toy leads may be found too late across approved sources.
  target: Prepare a private daily candidate list for human review without contacting sellers or purchasing items.
  success_measures:
    - Reduce weekly lead-review time without reducing useful discoveries.
    - Demonstrate an acceptable relevant-suggestion rate during a 30-day pilot.
  failure_signals:
    - Review work increases.
    - Condition or authenticity warnings are repeatedly missed.
    - Suggestions rely on a source whose terms do not permit the monitoring method.

scope:
  included:
    - Synthetic or specifically copied records representing one proposed source.
    - One narrow product category.
    - Private candidate summaries and ranking explanations.
  excluded:
    - Seller contact.
    - Purchasing or negotiation.
    - Authenticity claims or appraisals.
    - Public listings or marketing publication.

workflow:
  pattern: single_bounded_agent
  trigger: Owner starts the daily review for the approved source.
  steps:
    - id: collect-approved-candidates
      objective: Read synthetic or specifically copied candidate records without connecting to a live source.
      approval_required: false
      on_failure: Stop and report the unavailable or prohibited source.
    - id: prepare-review-list
      objective: Normalize visible details, flag missing information, and rank candidates for review.
      approval_required: false
      on_failure: Preserve the original candidates and return an unranked exception list.
    - id: owner-review
      objective: Present the private list and original-source links to the owner.
      approval_required: true
      on_failure: End the run without contacting a seller or changing a record.
  completion_condition: The owner receives the candidate list and records feedback.
  stop_conditions:
    - A record requires live-source access or reconstructing unavailable source data.
    - The run exceeds its approved time or candidate limit.
    - Required original-source evidence is missing.

authority:
  - capability: Read approved candidate information
    level: prohibited
    approver_or_boundary: Current example is design-only; a separately approved baseline or challenger blueprint must grant bounded access.
  - capability: Prepare a private candidate list
    level: prohibited
    approver_or_boundary: Current example is design-only; future prepare-only authority requires a separate stage approval.
  - capability: Contact sellers or purchase items
    level: prohibited
    approver_or_boundary: Human-only during the pilot.

data:
  - source: Synthetic or specifically copied candidate test records
    owner: Fictional business owner
    classification: Non-production test information
    authoritative: false

tools: []

controls:
  human_fallback: Owner performs the existing manual review.
  logging: Record candidate source, time, visible evidence, ranking reason, and owner feedback.
  shutdown: Owner disables the scheduled or manual pilot run.
  rollback: Delete private derived candidate lists and return to manual review.

tests:
  - Reject a candidate with missing original-source evidence.
  - Prevent seller contact and purchasing actions.
  - Stop when the permitted source is unavailable.

open_questions:
  - Which live source and access method could be permitted for a later connected evaluation?
  - What relevant-suggestion rate justifies continuing the pilot?
