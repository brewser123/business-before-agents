name: Experimental framework checks

on:
  pull_request:
    paths:
      - ".github/workflows/experimental-validation.yml"
      - "experimental/agentic-build-handoff/**"
      - "tests/ci/**"
      - "tests/scenarios/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation libraries
        run: python -m pip install jsonschema==4.26.0 PyYAML==6.0.3
      - name: Check blueprint and fictional scenario
        run: python -m unittest discover -s tests/ci -p 'test_*.py' -v
